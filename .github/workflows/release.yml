name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos_universal:
    # macos-14 resolves to an arm64 runner configuration that this repository
    # cannot use. macos-latest is the runner quality-gate already uses; both
    # architectures are cross-compiled into a universal binary below.
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      mac_sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check out release tag
        run: git checkout "$TAG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        id: build
        run: |
          export COPYFILE_DISABLE=1
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            -output dist/zmk-tui \
            target/aarch64-apple-darwin/release/zmk-tui \
            target/x86_64-apple-darwin/release/zmk-tui
          codesign --force --sign - dist/zmk-tui
          lipo -info dist/zmk-tui
          cp LICENSE dist/LICENSE
          tar -czf "dist/zmk-tui-${VERSION}-universal-apple-darwin.tar.gz" -C dist zmk-tui LICENSE
          SHA=$(shasum -a 256 "dist/zmk-tui-${VERSION}-universal-apple-darwin.tar.gz" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish macOS asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/zmk-tui-*-universal-apple-darwin.tar.gz
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  linux_x86_64:
    needs: macos_universal
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      linux_sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check out release tag
        env:
          TAG: ${{ needs.macos_universal.outputs.tag }}
        run: |
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          git checkout "$TAG"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Build Linux binary
        id: build
        run: |
          export COPYFILE_DISABLE=1
          cargo build --release --locked
          mkdir -p dist
          cp target/release/zmk-tui dist/zmk-tui
          cp LICENSE dist/LICENSE
          tar -czf "dist/zmk-tui-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C dist zmk-tui LICENSE
          SHA=$(sha256sum "dist/zmk-tui-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          file dist/zmk-tui
          ldd dist/zmk-tui | sort

      - name: Publish Linux asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/zmk-tui-*-x86_64-unknown-linux-gnu.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

  formula:
    needs: [macos_universal, linux_x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update Homebrew formula
        run: |
          git pull --ff-only origin main
          python3 tools/update_formula.py \
            "${{ needs.macos_universal.outputs.tag }}" \
            "${{ needs.macos_universal.outputs.mac_sha }}" \
            "${{ needs.linux_x86_64.outputs.linux_sha }}" \
            "$GITHUB_REPOSITORY"
          if git diff --quiet -- Formula/zmk-tui.rb; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/zmk-tui.rb
          git commit -m "chore: update Homebrew formula for ${{ needs.macos_universal.outputs.tag }}"
          git push origin main
